
name: Build GameBoost APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Unzip project
        run: |
          unzip -o GameBoostAnalyzerPro_Source.zip -d project
          find project -maxdepth 3 -type f | head -80

      - name: Build APK
        run: |
          cd project
          DIR=$(find . -name gradlew -type f | head -1)
          if [ -z "$DIR" ]; then
            echo "ERROR: Gradle wrapper not found in ZIP"
            exit 1
          fi
          cd "$(dirname "$DIR")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: GameBoostAnalyzerPro-APK
          path: project/**/*.apk
          
